<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐾 Haustier-Paradies</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg1: #fef3e2;
    --bg2: #e0f2fe;
    --card: #ffffff;
    --ink: #3b2f2f;
    --muted: #8a7a6d;
    --green: #4ade80;
    --amber: #fbbf24;
    --red: #f87171;
    --shadow: 0 10px 30px rgba(90, 60, 20, 0.12);
    --radius: 22px;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: "Segoe UI", "Helvetica Neue", Arial, "Hiragino Sans", "PingFang SC", "Microsoft YaHei", "Apple Color Emoji", "Segoe UI Emoji", sans-serif;
    background: linear-gradient(160deg, var(--bg1) 0%, var(--bg2) 100%);
    min-height: 100vh;
    color: var(--ink);
    padding-bottom: 60px;
  }

  /* ---------- Kopfbereich ---------- */
  header {
    text-align: center;
    padding: 28px 16px 10px;
  }
  header h1 {
    font-size: clamp(1.7rem, 5vw, 2.6rem);
    letter-spacing: 0.5px;
  }
  header p {
    color: var(--muted);
    margin-top: 6px;
    font-size: 1rem;
  }

  .lang-wrap { margin-top: 14px; }
  .lang-select {
    border: none;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 9px 18px;
    font-size: 0.92rem;
    font-weight: 700;
    color: var(--ink);
    box-shadow: 0 3px 10px rgba(90, 60, 20, 0.10);
    cursor: pointer;
    text-align: center;
  }

  /* ---------- Münz-Anzeige ---------- */
  #coinChip {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 40;
    background: linear-gradient(135deg, #fde68a, #f59e0b);
    color: #713f12;
    font-weight: 900;
    font-size: 1rem;
    padding: 9px 16px;
    border-radius: 999px;
    box-shadow: 0 4px 14px rgba(180, 120, 20, 0.35);
    transition: transform 0.2s;
  }
  #coinChip.bump { transform: scale(1.25) rotate(-4deg); }

  .tabs {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 14px auto 6px;
    flex-wrap: wrap;
    padding: 0 12px;
  }
  .tab-btn {
    border: none;
    cursor: pointer;
    font-size: 1rem;
    font-weight: 700;
    padding: 12px 22px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.7);
    color: var(--ink);
    box-shadow: 0 3px 10px rgba(90, 60, 20, 0.10);
    transition: transform 0.15s, background 0.2s;
  }
  .tab-btn:hover { transform: translateY(-2px); }
  .tab-btn.active {
    background: linear-gradient(135deg, #fb923c, #f97316);
    color: #fff;
  }

  main { max-width: 1180px; margin: 0 auto; padding: 14px; }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-top: 14px;
  }

  /* ---------- Haustier-Karte ---------- */
  .pet-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 18px 34px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .pet-card:hover { transform: translateY(-3px); }

  .pet-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }
  .pet-name { font-size: 1.25rem; font-weight: 800; }
  .pet-species { color: var(--muted); font-size: 0.85rem; margin-top: 2px; }

  .level-badge {
    background: linear-gradient(135deg, #a78bfa, #8b5cf6);
    color: #fff;
    font-size: 0.78rem;
    font-weight: 800;
    padding: 5px 11px;
    border-radius: 999px;
    white-space: nowrap;
    text-align: center;
  }
  .xp-mini {
    display: block;
    font-size: 0.68rem;
    font-weight: 600;
    opacity: 0.9;
    text-align: center;
  }

  .pet-stage {
    position: relative;
    text-align: center;
    padding: 14px 0 4px;
    min-height: 118px;
  }
  .pet-emoji {
    font-size: 78px;
    display: inline-block;
    animation: bounce 2.4s ease-in-out infinite;
    cursor: pointer;
    user-select: none;
  }
  .pet-card.sleeping .pet-emoji {
    animation: snooze 3s ease-in-out infinite;
    filter: grayscale(0.35) brightness(0.92);
  }
  .pet-card.sad .pet-emoji { animation: droop 3s ease-in-out infinite; }

  @keyframes bounce {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50%      { transform: translateY(-10px) rotate(2deg); }
  }
  @keyframes snooze {
    0%, 100% { transform: translateY(0) rotate(-4deg) scale(0.97); }
    50%      { transform: translateY(2px) rotate(-6deg) scale(0.97); }
  }
  @keyframes droop {
    0%, 100% { transform: translateY(2px) scale(0.96); }
    50%      { transform: translateY(4px) scale(0.95); }
  }
  @keyframes wiggle {
    0%   { transform: rotate(0); }
    25%  { transform: rotate(-12deg) scale(1.15); }
    50%  { transform: rotate(10deg) scale(1.15); }
    75%  { transform: rotate(-6deg) scale(1.08); }
    100% { transform: rotate(0); }
  }
  .pet-emoji.wiggle { animation: wiggle 0.6s ease; }

  .mood-emoji {
    position: absolute;
    top: 6px;
    right: 16%;
    font-size: 26px;
  }

  .bubble {
    background: #fff7ed;
    border: 2px solid #fed7aa;
    color: #7c4a12;
    border-radius: 14px;
    font-size: 0.88rem;
    font-weight: 600;
    padding: 8px 12px;
    text-align: center;
    margin: 6px 0 12px;
    min-height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Statusbalken ---------- */
  .stats { display: grid; gap: 8px; }
  .stat-row {
    display: grid;
    grid-template-columns: 26px 1fr 38px;
    align-items: center;
    gap: 8px;
    font-size: 0.9rem;
  }
  .stat-ico { text-align: center; }
  .bar {
    background: #f1ebe4;
    border-radius: 999px;
    height: 14px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    border-radius: 999px;
    background: var(--green);
    width: 50%;
    transition: width 0.5s ease, background 0.5s ease;
  }
  .fill.warn { background: var(--amber); }
  .fill.bad  { background: var(--red); }
  .stat-val {
    font-size: 0.78rem;
    font-weight: 700;
    color: var(--muted);
    text-align: right;
  }

  /* ---------- Aktions-Buttons ---------- */
  .actions {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-top: 14px;
  }
  .act {
    border: none;
    cursor: pointer;
    border-radius: 14px;
    padding: 10px 4px;
    font-size: 0.8rem;
    font-weight: 700;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: transform 0.12s, filter 0.2s;
  }
  .act span.big { font-size: 1.35rem; }
  .act:hover  { transform: translateY(-2px); }
  .act:active { transform: scale(0.93); }
  .act:disabled {
    filter: grayscale(0.8) opacity(0.55);
    cursor: not-allowed;
    transform: none;
  }
  .act-feed  { background: linear-gradient(135deg, #fb923c, #ea580c); }
  .act-play  { background: linear-gradient(135deg, #4ade80, #16a34a); }
  .act-sleep { background: linear-gradient(135deg, #818cf8, #4f46e5); }
  .act-wash  { background: linear-gradient(135deg, #38bdf8, #0284c7); }

  .give-back {
    position: absolute;
    bottom: 10px;
    right: 12px;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 0.72rem;
    color: #c2b3a3;
    font-weight: 600;
  }
  .give-back:hover { color: var(--red); text-decoration: underline; }

  /* ---------- Partikel ---------- */
  .particle {
    position: absolute;
    font-size: 24px;
    pointer-events: none;
    animation: floatUp 1.1s ease-out forwards;
    z-index: 5;
  }
  @keyframes floatUp {
    0%   { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.4); }
  }

  /* ---------- Tierheim ---------- */
  .shelter-info {
    margin-top: 14px;
    background: rgba(255, 255, 255, 0.75);
    border-radius: 999px;
    padding: 11px 20px;
    text-align: center;
    font-weight: 700;
    font-size: 0.95rem;
    color: #7c4a12;
    box-shadow: 0 3px 10px rgba(90, 60, 20, 0.10);
  }
  .shelter-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 18px;
    text-align: center;
    transition: transform 0.2s;
    position: relative;
  }
  .shelter-card:hover { transform: translateY(-4px); }
  .shelter-emoji { font-size: 64px; display: block; margin-top: 14px; }
  .shelter-card h3 { margin-top: 8px; font-size: 1.15rem; }
  .shelter-card p {
    color: var(--muted);
    font-size: 0.86rem;
    margin: 6px 0 14px;
    min-height: 40px;
  }
  .rarity {
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 0.68rem;
    font-weight: 800;
    padding: 4px 10px;
    border-radius: 999px;
    color: #fff;
  }
  .rarity.common { background: #94a3b8; }
  .rarity.rare   { background: linear-gradient(135deg, #818cf8, #6366f1); }
  .rarity.epic   { background: linear-gradient(135deg, #fbbf24, #f59e0b); color: #713f12; }
  .price-chip {
    position: absolute;
    top: 12px;
    right: 12px;
    font-size: 0.78rem;
    font-weight: 900;
    background: #fef3c7;
    color: #92400e;
    padding: 4px 10px;
    border-radius: 999px;
  }
  .adopt-btn {
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #f472b6, #db2777);
    color: #fff;
    font-weight: 800;
    font-size: 0.95rem;
    padding: 11px 26px;
    border-radius: 999px;
    transition: transform 0.15s;
  }
  .adopt-btn:hover { transform: scale(1.06); }
  .adopt-btn.locked { filter: grayscale(0.6) opacity(0.7); }

  /* ---------- Spiele-Tab ---------- */
  .game-card {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 26px 20px;
    text-align: center;
    transition: transform 0.2s;
  }
  .game-card:hover { transform: translateY(-4px); }
  .game-ico { font-size: 58px; display: block; }
  .game-card h3 { margin-top: 10px; font-size: 1.2rem; }
  .game-card p { color: var(--muted); font-size: 0.88rem; margin: 8px 0 16px; min-height: 42px; }
  .play-btn {
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #a78bfa, #7c3aed);
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    padding: 12px 34px;
    border-radius: 999px;
    transition: transform 0.15s;
  }
  .play-btn:hover { transform: scale(1.07); }

  /* ---------- Spiel-Overlay (3D) ---------- */
  #gameOverlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    background: linear-gradient(180deg, #7dd3fc 0%, #e0f2fe 55%, #86efac 55.2%, #4ade80 100%);
    overflow: hidden;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  #gameOverlay.open { display: block; }

  #gameHud {
    position: absolute;
    top: 0; left: 0; right: 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    z-index: 20;
    font-weight: 900;
    font-size: 1.15rem;
    color: #1e3a5f;
  }
  #gameHud .hud-chip {
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    padding: 8px 16px;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
  }
  #gQuit {
    border: none;
    cursor: pointer;
    background: rgba(255, 255, 255, 0.85);
    border-radius: 999px;
    width: 42px;
    height: 42px;
    font-size: 1.1rem;
    font-weight: 900;
    color: #b91c1c;
    box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
  }

  #gameStage {
    position: absolute;
    inset: 0;
    perspective: 700px;
    perspective-origin: 50% 42%;
  }

  /* 3D-Boden für das Fang-Spiel */
  .floor3d {
    position: absolute;
    left: -60%;
    bottom: -30%;
    width: 220%;
    height: 90%;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.35) 0 3px, transparent 3px 70px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.35) 0 3px, transparent 3px 70px),
      linear-gradient(180deg, #86efac, #22c55e);
    transform: rotateX(72deg);
    transform-origin: 50% 0;
  }

  .treat3d {
    position: absolute;
    left: 50%;
    top: 42%;
    font-size: 64px;
    cursor: pointer;
    will-change: transform;
    filter: drop-shadow(0 12px 8px rgba(0, 0, 0, 0.25));
    z-index: 10;
  }
  .treat3d.pop { animation: treatPop 0.3s ease-out forwards; pointer-events: none; }
  @keyframes treatPop {
    0%   { opacity: 1; }
    100% { opacity: 0; transform: scale(2.2) rotate(20deg); }
  }

  /* Memory-Spiel (3D-Kartenflip) */
  .memory-wrap {
    position: absolute;
    inset: 70px 0 0 0;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 900px;
  }
  .memory-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(64px, 110px));
    gap: 12px;
    padding: 12px;
    transform: rotateX(8deg);
    transform-style: preserve-3d;
  }
  @media (max-width: 500px) {
    .memory-grid { grid-template-columns: repeat(3, minmax(70px, 100px)); }
  }
  .mcard {
    aspect-ratio: 3 / 4;
    cursor: pointer;
    background: transparent;
    border: none;
    perspective: 600px;
  }
  .mcard-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 1.4, 0.6, 1);
  }
  .mcard.flip .mcard-inner { transform: rotateY(180deg); }
  .mcard.matched .mcard-inner { transform: rotateY(180deg) scale(1.06); }
  .mface {
    position: absolute;
    inset: 0;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(28px, 6vw, 44px);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
  }
  .mface.front { background: linear-gradient(135deg, #818cf8, #6366f1); color: #fff; }
  .mface.back  { background: #fff; transform: rotateY(180deg); }
  .mcard.matched .mface.back { background: #dcfce7; box-shadow: 0 0 0 3px #4ade80 inset, 0 8px 18px rgba(0,0,0,0.18); }

  /* Ergebnis-Anzeige */
  #gameResult {
    position: absolute;
    inset: 0;
    z-index: 30;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(30, 30, 50, 0.45);
  }
  #gameResult.open { display: flex; }
  .result-card {
    background: #fff;
    border-radius: 24px;
    padding: 34px 30px;
    text-align: center;
    max-width: 340px;
    width: calc(100% - 40px);
    box-shadow: 0 24px 70px rgba(0, 0, 0, 0.35);
  }
  .result-card .r-emoji { font-size: 64px; }
  .result-card h2 { margin: 10px 0 6px; }
  .result-card p { color: var(--muted); font-weight: 700; margin-bottom: 18px; }
  .result-card button {
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #4ade80, #16a34a);
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    padding: 13px 40px;
    border-radius: 999px;
  }

  /* ---------- Leerer Zustand ---------- */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty .paw { font-size: 64px; display: block; margin-bottom: 12px; }
  .empty button {
    margin-top: 18px;
    border: none;
    cursor: pointer;
    background: linear-gradient(135deg, #fb923c, #f97316);
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    padding: 13px 30px;
    border-radius: 999px;
  }

  /* ---------- Modal ---------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(50, 35, 20, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #fff;
    border-radius: var(--radius);
    padding: 28px 24px;
    max-width: 380px;
    width: 100%;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
  }
  .modal .m-emoji { font-size: 60px; }
  .modal h2 { margin: 8px 0 4px; font-size: 1.3rem; }
  .modal .m-price { font-weight: 900; color: #92400e; margin-bottom: 6px; }
  .modal p { color: var(--muted); font-size: 0.9rem; margin-bottom: 14px; }
  .modal input {
    width: 100%;
    padding: 12px 14px;
    font-size: 1.05rem;
    border: 2px solid #fcd9b6;
    border-radius: 14px;
    outline: none;
    text-align: center;
    font-weight: 700;
    color: var(--ink);
  }
  .modal input:focus { border-color: #fb923c; }
  .modal .m-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal .m-actions button {
    flex: 1;
    border: none;
    cursor: pointer;
    padding: 12px;
    border-radius: 14px;
    font-weight: 800;
    font-size: 0.95rem;
  }
  .m-cancel { background: #f1ebe4; color: var(--muted); }
  .m-ok {
    background: linear-gradient(135deg, #4ade80, #16a34a);
    color: #fff;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(80px);
    background: #3b2f2f;
    color: #fff;
    padding: 13px 22px;
    border-radius: 999px;
    font-size: 0.92rem;
    font-weight: 600;
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease;
    z-index: 120;
    max-width: 90vw;
    text-align: center;
  }
  #toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
  }

  @media (max-width: 420px) {
    .pet-emoji { font-size: 64px; }
    .act { font-size: 0.72rem; }
    #coinChip { top: 8px; right: 8px; font-size: 0.9rem; }
  }
</style>
</head>
<body>

<div id="coinChip">🪙 <span id="coinVal">0</span></div>

<header>
  <h1 id="appTitle">🐾 Haustier-Paradies</h1>
  <p id="appTagline"></p>
  <div class="lang-wrap">
    <select class="lang-select" id="langSelect" onchange="setLang(this.value)"></select>
  </div>
</header>

<div class="tabs">
  <button class="tab-btn active" id="tabHome" onclick="showTab('home')"></button>
  <button class="tab-btn" id="tabShelter" onclick="showTab('shelter')"></button>
  <button class="tab-btn" id="tabGames" onclick="showTab('games')"></button>
</div>

<main>
  <section id="homeSection">
    <div class="grid" id="homeGrid"></div>
    <div class="empty" id="emptyHome" style="display:none;">
      <span class="paw">🐾</span>
      <h2 id="emptyTitle"></h2>
      <p id="emptyText"></p>
      <button id="emptyBtn" onclick="showTab('shelter')"></button>
    </div>
  </section>

  <section id="shelterSection" style="display:none;">
    <div class="shelter-info" id="shelterInfo"></div>
    <div class="grid" id="shelterGrid"></div>
  </section>

  <section id="gamesSection" style="display:none;">
    <div class="grid" id="gamesGrid"></div>
  </section>
</main>

<!-- Adoptions-Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="m-emoji" id="modalEmoji">🐕</div>
    <h2 id="modalTitle"></h2>
    <div class="m-price" id="modalPrice"></div>
    <p id="modalQuestion"></p>
    <input type="text" id="nameInput" maxlength="16">
    <div class="m-actions">
      <button class="m-cancel" id="mCancel" onclick="closeModal()"></button>
      <button class="m-ok" id="mOk" onclick="confirmAdopt()"></button>
    </div>
  </div>
</div>

<!-- Spiel-Overlay -->
<div id="gameOverlay">
  <div id="gameHud">
    <span class="hud-chip" id="gInfo1">⏱ 30</span>
    <span class="hud-chip" id="gInfo2">🎯 0</span>
    <button id="gQuit" onclick="quitGame()">✕</button>
  </div>
  <div id="gameStage"></div>
  <div id="gameResult">

function detectLang() {
  let saved = null;
  try { saved = localStorage.getItem('haustierLang'); } catch (e) { /* privater Modus */ }
  if (saved && I18N[saved]) return saved;
  const nav = (navigator.language || 'de').slice(0, 2).toLowerCase();
  const alias = { nb: 'no', nn: 'no' };
  const code = alias[nav] || nav;
  return I18N[code] ? code : 'de';
}
function T() { return I18N[lang]; }
function fmt(str, vars) { return str.replace(/\{(\w+)\}/g, (_, k) => (vars && vars[k] !== undefined) ? vars[k] : ''); }

function setLang(code) {
  if (!I18N[code]) return;
  lang = code;
  try { localStorage.setItem('haustierLang', code); } catch (e) { /* privater Modus */ }
  applyLang();
}

/* Basis-Abnahme pro Minute (wird mit Arten-Faktor multipliziert) */
const DECAY = { hunger: 4.5, fun: 3.5, energy: 2.5, clean: 2.5 };
const STATS = [
  { key: 'hunger', ico: '🍖' },
  { key: 'fun',    ico: '😊' },
  { key: 'energy', ico: '⚡' },
  { key: 'clean',  ico: '🧼' },
];
const MAX_CATCHUP_MIN = 120;   // Offline-Zeit wird auf 2 h begrenzt
const SLEEP_SECONDS = 20;
const START_COINS = 100;
const SHELTER_WINDOW_MS = 10 * 60 * 1000;  // alle 10 Minuten neue Tiere
const SHELTER_SIZE = 6;

/* ================= Spielstand ================= */
let state = { pets: [], nextId: 1, coins: START_COINS, lastSeen: Date.now() };

function save() {
  state.lastSeen = Date.now();
  try { localStorage.setItem('haustierParadies', JSON.stringify(state)); } catch (e) { /* privater Modus */ }
}

function load() {
  let raw = null;
  try { raw = localStorage.getItem('haustierParadies'); } catch (e) { /* privater Modus */ }
  if (raw) {
    try {
      const data = JSON.parse(raw);
      if (data && Array.isArray(data.pets)) state = data;
    } catch (e) { /* kaputter Spielstand -> neu anfangen */ }
  }
  if (typeof state.coins !== 'number') state.coins = START_COINS; // Migration älterer Spielstände

  // Offline-Aufholung: Werte sinken auch, während die Seite zu war
  const elapsedMin = Math.min(MAX_CATCHUP_MIN, (Date.now() - (state.lastSeen || Date.now())) / 60000);
  if (elapsedMin > 0.5) {
    state.pets.forEach(p => applyDecay(p, elapsedMin));
    if (elapsedMin > 2) {
      setTimeout(() => toast(T().toastBack), 600);
    }
  }
  state.pets.forEach(p => { p.sleepUntil = 0; }); // nach Neuladen ist niemand mehr im Nickerchen
}

/* ================= Münzen ================= */
function addCoins(n) {
  state.coins = Math.max(0, state.coins + n);
  save();
  updateCoinChip(true);
}
function updateCoinChip(bump) {
  document.getElementById('coinVal').textContent = Math.floor(state.coins);
  if (bump) {
    const chip = document.getElementById('coinChip');
    chip.classList.remove('bump');
    void chip.offsetWidth;
    chip.classList.add('bump');
    setTimeout(() => chip.classList.remove('bump'), 250);
  }
}

/* ================= Spiel-Logik ================= */
function speciesOf(pet) { return SPECIES.find(s => s.key === pet.species) || SPECIES[0]; }
function clamp(v) { return Math.max(0, Math.min(100, v)); }

function applyDecay(pet, minutes) {
  const r = speciesOf(pet).rates;
  const sleeping = pet.sleepUntil > Date.now();
  pet.hunger = clamp(pet.hunger - DECAY.hunger * r.hunger * minutes * (sleeping ? 0.5 : 1));
  pet.fun    = clamp(pet.fun    - DECAY.fun    * r.fun    * minutes * (sleeping ? 0.3 : 1));
  pet.clean  = clamp(pet.clean  - DECAY.clean  * r.clean  * minutes * (sleeping ? 0.3 : 1));
  if (sleeping) {
    pet.energy = clamp(pet.energy + 5 * minutes * 60); // +5 pro Sekunde
    if (pet.energy >= 100) pet.sleepUntil = 0;         // ausgeschlafen -> früher aufwachen
  } else {
    pet.energy = clamp(pet.energy - DECAY.energy * r.energy * minutes);
  }
}

function gainXp(pet, amount) {
  pet.xp += amount;
  let needed = xpNeeded(pet.level);
  while (pet.xp >= needed) {
    pet.xp -= needed;
    pet.level += 1;
    needed = xpNeeded(pet.level);
    setMessage(pet, fmt(T().msgLevel, { lvl: pet.level }), 4000);
    burst(pet.id, ['🎉', '⭐', '🎊', '⭐'], 8);
    addCoins(20);
    burst(pet.id, ['🪙'], 3);
  }
}
function xpNeeded(level) { return 40 + (level - 1) * 30; }

/* kurzzeitige Sprechblasen-Nachricht */
const tempMsg = {}; // id -> {text, until}
function setMessage(pet, text, ms = 3200) {
  tempMsg[pet.id] = { text, until: Date.now() + ms };
}

function moodOf(pet) {
  const t = T();
  if (pet.sleepUntil > Date.now()) {
    return { emoji: '😴', text: fmt(t.sleeping, { name: pet.name }), cls: 'sleeping' };
  }
  const worst = STATS.reduce((a, b) => (pet[a.key] <= pet[b.key] ? a : b));
  const v = pet[worst.key];
  if (v < 20) return { emoji: '😢', text: fmt(t.need[worst.key], { name: pet.name }), cls: 'sad' };
  if (v < 45) return { emoji: '😕', text: fmt(t.soft[worst.key], { name: pet.name }), cls: '' };
  if (v < 70) return { emoji: '🙂', text: fmt(t.moodOk, { name: pet.name }), cls: '' };
  return { emoji: '😄', text: fmt(t.moodGreat, { name: pet.name }), cls: '' };
}

/* ================= Aktionen ================= */
function doAction(id, action) {
  const pet = state.pets.find(p => p.id === id);
  if (!pet) return;
  const t = T();
  const sp = speciesOf(pet);
  const sleeping = pet.sleepUntil > Date.now();

  if (action === 'sleep') {
    if (sleeping) {
      pet.sleepUntil = 0;
      setMessage(pet, t.msgWake);
    } else {
      pet.sleepUntil = Date.now() + SLEEP_SECONDS * 1000;
      setMessage(pet, t.msgNap, SLEEP_SECONDS * 1000);
      burst(id, ['💤'], 3);
    }
  } else if (sleeping) {
    return; // andere Aktionen gehen nicht im Schlaf
  } else if (action === 'feed') {
    pet.hunger = clamp(pet.hunger + 35);
    pet.clean = clamp(pet.clean - 4);
    setMessage(pet, fmt(t.msgFeed, { food: sp.food }));
    burst(id, [sp.food, '😋', sp.food], 5);
    gainXp(pet, 5);
    addCoins(1);
  } else if (action === 'play') {
    if (pet.energy < 10) {
      setMessage(pet, fmt(t.msgTired, { name: pet.name }));
    } else {
      pet.fun = clamp(pet.fun + 35);
      pet.energy = clamp(pet.energy - 12);
      pet.hunger = clamp(pet.hunger - 6);
      setMessage(pet, t.msgPlay);
      burst(id, ['🎾', '❤️', '🎉'], 6);
      gainXp(pet, 8);
      addCoins(2);
    }
  } else if (action === 'wash') {
    pet.clean = clamp(pet.clean + 45);
    pet.fun = clamp(pet.fun + sp.bath);
    setMessage(pet, sp.bath < 0 ? t.msgBathNo : t.msgBathYes);
    burst(id, ['🫧', '💦', '🧼'], 6);
    gainXp(pet, 5);
    addCoins(1);
  }

  wigglePet(id);
  save();
  updateCard(pet);
}

function pokePet(id) {
  const pet = state.pets.find(p => p.id === id);
  if (!pet || pet.sleepUntil > Date.now()) return;
  setMessage(pet, fmt(T().msgPet, { name: pet.name }));
  burst(id, ['❤️'], 3);
  wigglePet(id);
  updateCard(pet);
}

function giveBack(id) {
  const pet = state.pets.find(p => p.id === id);
  if (!pet) return;
  if (!confirm(fmt(T().confirmBack, { name: pet.name }))) return;
  state.pets = state.pets.filter(p => p.id !== id);
  save();
  renderHome();
  toast(fmt(T().toastBye, { name: pet.name }));
}

/* ================= Tierheim-Rotation ================= */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shelterWindow() { return Math.floor(Date.now() / SHELTER_WINDOW_MS); }

function currentShelter() {
  const rnd = mulberry32(shelterWindow() % 2147483647);
  const pool = [...SPECIES];
  const picked = [];
  const weightOf = s => (s.rarity === 'epic' ? 1 : s.rarity === 'rare' ? 2 : 5);
  while (picked.length < SHELTER_SIZE && pool.length) {
    const total = pool.reduce((sum, s) => sum + weightOf(s), 0);
    let roll = rnd() * total;
    let idx = 0;
    for (; idx < pool.length; idx++) {
      roll -= weightOf(pool[idx]);
      if (roll <= 0) break;
    }
    picked.push(pool.splice(Math.min(idx, pool.length - 1), 1)[0]);
  }
  return picked;
}

function shelterCountdown() {
  const msLeft = (shelterWindow() + 1) * SHELTER_WINDOW_MS - Date.now();
  const m = Math.floor(msLeft / 60000);
  const s = Math.floor((msLeft % 60000) / 1000);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
}

let adoptKey = null;

function openAdopt(key) {
  const sp = SPECIES.find(s => s.key === key);
  if (state.coins < sp.price) {
    toast(T().noCoins);
    return;
  }
  adoptKey = key;
  document.getElementById('modalEmoji').textContent = sp.emoji;
  document.getElementById('modalTitle').textContent = fmt(T().adoptTitle, { species: T().species[key].label });
  document.getElementById('modalPrice').textContent = `🪙 ${sp.price}`;
  const input = document.getElementById('nameInput');
  input.value = sp.names[Math.floor(Math.random() * sp.names.length)];
  document.getElementById('modalOverlay').classList.add('open');
  setTimeout(() => { input.focus(); input.select(); }, 50);
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  adoptKey = null;
}

function confirmAdopt() {
  if (!adoptKey) return;
  const sp = SPECIES.find(s => s.key === adoptKey);
  if (state.coins < sp.price) { closeModal(); toast(T().noCoins); return; }
  const name = (document.getElementById('nameInput').value.trim() || sp.names[0]).slice(0, 16);
  addCoins(-sp.price);
  state.pets.push({
    id: state.nextId++,
    species: sp.key,
    name,
    hunger: 80, fun: 80, energy: 80, clean: 80,
    xp: 0, level: 1, sleepUntil: 0,
  });
  save();
  closeModal();
  showTab('home');
  toast(fmt(T().toastIn, { emoji: sp.emoji, name }));
}

      <button class="adopt-btn ${state.coins < sp.price ? 'locked' : ''}" onclick="openAdopt('${sp.key}')">${escapeHtml(t.adoptBtn)}</button>
    </div>
  `).join('');
}

function renderGames() {
  const t = T();
  document.getElementById('gamesGrid').innerHTML = `
    <div class="game-card">
      <span class="game-ico">🍖✨</span>

    <div class="game-card">

}

function renderHome() {
  const t = T();
  const grid = document.getElementById('homeGrid');
  const empty = document.getElementById('emptyHome');
  document.getElementById('tabHome').textContent = fmt(t.tabHome, { n: state.pets.length });
  empty.style.display = state.pets.length ? 'none' : '';
  grid.innerHTML = state.pets.map(pet => {
    const sp = speciesOf(pet);
    return `
    <div class="pet-card" id="pet-${pet.id}">
      <div class="pet-top">
        <div>
          <div class="pet-name">${escapeHtml(pet.name)}</div>
          <div class="pet-species">${sp.emoji} ${escapeHtml(t.species[sp.key].label)}</div>
        </div>
        <div class="level-badge"><span class="lvl-line"></span><span class="xp-mini"><span class="xp"></span> XP</span></div>
      </div>
      <div class="pet-stage">
        <span class="mood-emoji"></span>
        <span class="pet-emoji" onclick="pokePet(${pet.id})">${sp.emoji}</span>
      </div>
      <div class="bubble"></div>
      <div class="stats">
        ${STATS.map(st => `
          <div class="stat-row">
            <span class="stat-ico">${st.ico}</span>
            <div class="bar"><div class="fill" data-stat="${st.key}"></div></div>
            <span class="stat-val" data-val="${st.key}"></span>
          </div>`).join('')}
      </div>
      <div class="actions">
        <button class="act act-feed"  onclick="doAction(${pet.id}, 'feed')"><span class="big">🍖</span>${escapeHtml(t.actFeed)}</button>
        <button class="act act-play"  onclick="doAction(${pet.id}, 'play')"><span class="big">🎾</span>${escapeHtml(t.actPlay)}</button>
        <button class="act act-sleep" onclick="doAction(${pet.id}, 'sleep')"><span class="big">💤</span><span class="sleep-label"></span></button>
        <button class="act act-wash"  onclick="doAction(${pet.id}, 'wash')"><span class="big">🛁</span>${escapeHtml(t.actWash)}</button>
      </div>
      <button class="give-back" onclick="giveBack(${pet.id})">${escapeHtml(t.giveBack)}</button>
    </div>`;
  }).join('');
  state.pets.forEach(updateCard);
}

function updateCard(pet) {
  const card = document.getElementById('pet-' + pet.id);
  if (!card) return;
  const t = T();
  const sleeping = pet.sleepUntil > Date.now();
  const mood = moodOf(pet);

  card.classList.toggle('sleeping', sleeping);
  card.classList.toggle('sad', mood.cls === 'sad');
  card.querySelector('.lvl-line').textContent = `${t.level} ${pet.level}`;
  card.querySelector('.xp').textContent = `${Math.floor(pet.xp)} / ${xpNeeded(pet.level)}`;
  card.querySelector('.mood-emoji').textContent = mood.emoji;

  const m = tempMsg[pet.id];
  card.querySelector('.bubble').textContent = (m && m.until > Date.now()) ? m.text : mood.text;

  STATS.forEach(st => {
    const v = Math.round(pet[st.key]);
    const fill = card.querySelector(`.fill[data-stat="${st.key}"]`);
    fill.style.width = v + '%';
    fill.classList.toggle('warn', v < 60 && v >= 30);
    fill.classList.toggle('bad', v < 30);
    card.querySelector(`.stat-val[data-val="${st.key}"]`).textContent = v;
  });

  card.querySelector('.sleep-label').textContent = sleeping ? t.actWake : t.actSleep;
  card.querySelectorAll('.act-feed, .act-play, .act-wash').forEach(b => { b.disabled = sleeping; });
}

/* ================= Mini-Spiele ================= */
const gameOverlayEl = () => document.getElementById('gameOverlay');
const gameStageEl = () => document.getElementById('gameStage');
let activeGame = null;

function openOverlay() {
  gameOverlayEl().classList.add('open');
  document.getElementById('gameResult').classList.remove('open');
  gameStageEl().innerHTML = '';
}
function closeGame() {
  gameOverlayEl().classList.remove('open');
  document.getElementById('gameResult').classList.remove('open');
  stopCatchLoop();
  activeGame = null;
  updateCoinChip();
}
function quitGame() {
  stopCatchLoop();
  closeGame();
}
function showResult(coins) {
  const t = T();
  addCoins(coins);
  document.getElementById('rTitle').textContent = t.gameDone;
  document.getElementById('rText').textContent = fmt(t.gameEarned, { coins });
  document.getElementById('rBtn').textContent = t.gameClose;
  document.getElementById('gameResult').classList.add('open');
}

/* --- Spiel 1: Leckerli-Fangen (3D-Perspektive) --- */
const catchGame = { running: false, score: 0, timeLeft: 30, treats: [], raf: 0, spawnTimer: 0, clock: 0 };
const TREAT_EMOJIS = ['🦴', '🐟', '🥕', '🥩', '🧀', '🍎', '🌽', '🍗'];

function startCatchGame() {
  openOverlay();
  activeGame = 'catch';
  catchGame.running = true;
  catchGame.score = 0;
  catchGame.timeLeft = 30;
  catchGame.treats = [];
  gameStageEl().innerHTML = '<div class="floor3d"></div>';
  updateHud();

  catchGame.clock = setInterval(() => {
    catchGame.timeLeft -= 1;
    updateHud();
    if (catchGame.timeLeft <= 0) finishCatchGame();
  }, 1000);
  catchGame.spawnTimer = setInterval(spawnTreat, 650);
  spawnTreat();
  let last = performance.now();
  const loop = (now) => {
    if (!catchGame.running) return;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    for (const tr of [...catchGame.treats]) {
      tr.z += tr.speed * dt;
      tr.y = -60 + (tr.z + 1400) / 1600 * 180;
      tr.el.style.transform = `translate(-50%, -50%) translate3d(${tr.x}px, ${tr.y}px, ${tr.z}px) rotate(${tr.z / 14}deg)`;
      if (tr.z > 240) removeTreat(tr);
    }
    catchGame.raf = requestAnimationFrame(loop);
  };
  catchGame.raf = requestAnimationFrame(loop);
}

function spawnTreat() {
  if (!catchGame.running) return;
  const el = document.createElement('span');
  el.className = 'treat3d';
  el.textContent = TREAT_EMOJIS[Math.floor(Math.random() * TREAT_EMOJIS.length)];
  const tr = {
    el,
    x: (Math.random() - 0.5) * Math.min(560, window.innerWidth * 0.7),
    y: 0,
    z: -1400,
    speed: 420 + Math.random() * 180 + (30 - catchGame.timeLeft) * 12,
  };
  el.style.transform = `translate(-50%, -50%) translate3d(${tr.x}px, 0px, -1400px)`;
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (!catchGame.running) return;
    catchGame.score += 1;
    updateHud();
    el.classList.add('pop');
    catchGame.treats = catchGame.treats.filter(x => x !== tr);
    setTimeout(() => el.remove(), 320);
  });
  gameStageEl().appendChild(el);
  catchGame.treats.push(tr);
}

function removeTreat(tr) {
  tr.el.remove();
  catchGame.treats = catchGame.treats.filter(x => x !== tr);
}

function updateHud() {
  if (activeGame === 'catch') {
    document.getElementById('gInfo1').textContent = `⏱ ${catchGame.timeLeft}`;
    document.getElementById('gInfo2').textContent = `🎯 ${catchGame.score}`;
  } else if (activeGame === 'memory') {
    document.getElementById('gInfo1').textContent = `🔁 ${memoryGame.misses}`;
    document.getElementById('gInfo2').textContent = `🎯 ${memoryGame.matched} / ${memoryGame.pairs}`;
  }
}

function stopCatchLoop() {
  catchGame.running = false;
  cancelAnimationFrame(catchGame.raf);
  clearInterval(catchGame.clock);
  clearInterval(catchGame.spawnTimer);
}

function finishCatchGame() {
  stopCatchLoop();
  showResult(catchGame.score * 2);
}

/* --- Spiel 2: Tier-Memory (3D-Kartenflip) --- */
const memoryGame = { deck: [], first: null, lock: false, matched: 0, misses: 0, pairs: 6 };

function startMemoryGame() {
  openOverlay();
  activeGame = 'memory';
  memoryGame.first = null;
  memoryGame.lock = false;
  memoryGame.matched = 0;
  memoryGame.misses = 0;

  const pool = [...SPECIES].sort(() => Math.random() - 0.5).slice(0, memoryGame.pairs);
  memoryGame.deck = [...pool, ...pool].map(sp => sp.emoji).sort(() => Math.random() - 0.5);

  const wrap = document.createElement('div');
  wrap.className = 'memory-wrap';
  const grid = document.createElement('div');
  grid.className = 'memory-grid';
  memoryGame.deck.forEach((emoji, idx) => {
    const card = document.createElement('button');
    card.className = 'mcard';
    card.dataset.idx = idx;
    card.dataset.emoji = emoji;
    card.innerHTML = `<span class="mcard-inner"><span class="mface front">🐾</span><span class="mface back">${emoji}</span></span>`;
    card.addEventListener('click', () => flipCard(card));
    grid.appendChild(card);
  });
  wrap.appendChild(grid);
  gameStageEl().appendChild(wrap);
  updateHud();
}

function flipCard(card) {
  if (memoryGame.lock || card.classList.contains('flip') || card.classList.contains('matched')) return;
  card.classList.add('flip');
  if (!memoryGame.first) {
    memoryGame.first = card;
    return;
  }
  const a = memoryGame.first;
  memoryGame.first = null;
  if (a.dataset.emoji === card.dataset.emoji) {
    a.classList.add('matched');
    card.classList.add('matched');
    memoryGame.matched += 1;
    updateHud();
    if (memoryGame.matched >= memoryGame.pairs) {
      setTimeout(() => showResult(Math.max(10, 40 - memoryGame.misses * 2)), 550);
    }
  } else {
    memoryGame.misses += 1;
    memoryGame.lock = true;
    updateHud();
    setTimeout(() => {
      a.classList.remove('flip');
      card.classList.remove('flip');
      memoryGame.lock = false;
    }, 750);
  }
}

/* ================= Effekte ================= */
function wigglePet(id) {
  const el = document.querySelector(`#pet-${id} .pet-emoji`);
  if (!el) return;
  el.classList.remove('wiggle');
  void el.offsetWidth; // Animation neu starten
  el.classList.add('wiggle');
}

function burst(id, emojis, count) {
  const stageEl = document.querySelector(`#pet-${id} .pet-stage`);
  if (!stageEl) return;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('span');
    p.className = 'particle';
    p.textContent = emojis[i % emojis.length];
    p.style.left = (25 + Math.random() * 50) + '%';
    p.style.bottom = (10 + Math.random() * 30) + 'px';
    p.style.animationDelay = (Math.random() * 0.35) + 's';
    stageEl.appendChild(p);
    setTimeout(() => p.remove(), 1600);
  }
}

let toastTimer = null;
function toast(text) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3500);
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ================= Game-Loop ================= */
let lastTick = Date.now();
setInterval(() => {
  const now = Date.now();
  const minutes = Math.min(MAX_CATCHUP_MIN, (now - lastTick) / 60000);
  lastTick = now;
  state.pets.forEach(pet => {
    const wasSleeping = pet.sleepUntil > now - 1000;
    applyDecay(pet, minutes);
    if (wasSleeping && pet.sleepUntil <= Date.now() && pet.energy >= 99) {
      setMessage(pet, T().msgSlept);
    }
    updateCard(pet);
  });
  save();

  // Tierheim: Countdown & Rotation
  const shelterVisible = document.getElementById('shelterSection').style.display !== 'none';
  if (shelterWindow() !== lastShelterWindow) {
    lastShelterWindow = shelterWindow();
    renderShelter();
    toast(T().newPets);
  } else if (shelterVisible) {
    document.getElementById('shelterInfo').textContent = fmt(T().newPetsIn, { time: shelterCountdown() });
  }
}, 1000);

});
